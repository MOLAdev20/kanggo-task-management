services:
  db:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: kanggo_task_management
      MARIADB_USER: kanggo
      MARIADB_PASSWORD: kanggo_password
      MARIADB_ROOT_PASSWORD: root_password
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
    environment:
      PORT: 8080
      CORS_ORIGIN: http://localhost:5173
      JWT_SECRET_KEY: change-this-secret-before-production
      JWT_EXPIRED_DURATION: 1d
      DATABASE_URL: mysql://kanggo:kanggo_password@db:3306/kanggo_task_management
      DATABASE_USER: kanggo
      DATABASE_PASSWORD: kanggo_password
      DATABASE_NAME: kanggo_task_management
      DATABASE_HOST: db
      DATABASE_PORT: 3306
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    environment:
      VITE_API_URL: http://localhost:8080
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  mariadb_data:
